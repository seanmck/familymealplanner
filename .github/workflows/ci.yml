name: CI

# Gate for the Railway deploy. Railway watches main through its native GitHub
# integration and builds on push, so this runs alongside the deploy rather than
# before it — a red build here means "revert or fix forward", not "deploy
# blocked". Keep it fast so that signal lands before the deploy finishes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `next build` typechecks app code, but not files outside the graph
      # (scripts, mcp server), so run tsc explicitly first.
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          # next build never connects to Postgres, but Prisma's client
          # constructor throws at import time if DATABASE_URL is missing and a
          # page's module graph touches lib/db at build time.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
