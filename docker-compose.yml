services:
  postgres:
    image: postgres:16-alpine
    container_name: familytable-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: familytable
      POSTGRES_PASSWORD: familytable_dev
      POSTGRES_DB: familytable
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U familytable -d familytable']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
